# Настроено под существующую установку на skyputh.
#
# name закреплён: сеть проекта — enricher-docker_default, и к ней подключён
# nginx-proxy-manager. Если имя проекта уедет (compose берёт его из имени
# каталога), сеть станет другой, NPM перестанет резолвить ai-enricher и домен
# ответит 502.
name: enricher-docker

services:
  enricher:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:24-alpine}
    container_name: ai-enricher      # по этому имени NPM ходит внутри сети
    ports:
      # Только loopback хоста: наружу сервис публикует nginx-proxy-manager, он
      # в той же сети и обращается по имени контейнера. Прежняя публикация на
      # 0.0.0.0:3004 открывала /api/enrich всему интернету.
      # Хостовый 3000 занят другим проектом — не занимать.
      - "127.0.0.1:${HOST_PORT:-3004}:3000"
    # Резолвер провайдера отдавал для openrouter.ai подменённый адрес: вместо
    # 8.47.69.6 приходил 8.47.69.0 — сетевой адрес той же подсети. Заглушка
    # принимает TCP (nc -z говорит «открыто»), а TLS-рукопожатие проглатывает,
    # отсюда Connect Timeout при живой на вид сети.
    # Публичные резолверы здесь безопасны: наружу ходим только к openrouter.ai
    # и mrmag.ru, а имена контейнеров по-прежнему разрешает встроенный 127.0.0.11.
    # На канале сервера DNS-ответы для openrouter.ai приходят изуродованными:
    # последний компонент адреса обнулён (8.47.69.6 → 8.47.69.0,
    # 2a06:98c1:3122:8000::6 → ...:8000::). Заглушка принимает TCP, поэтому
    # порт выглядит открытым, а TLS-рукопожатие уходит без ответа. Подмена
    # прозрачная — публичные резолверы её не обходят, ответ портится по дороге.
    #
    # Поэтому адреса закреплены здесь. Это костыль со сроком годности: адреса
    # OpenRouter могут смениться. Сервер печатает их при старте, а smoke.mjs
    # проверяет /api/models — протухание будет видно сразу, а не через месяц.
    # Освежить список: dig +short openrouter.ai с сети без подмены.
    extra_hosts:
      - "openrouter.ai:8.47.69.6"
      - "openrouter.ai:8.6.112.6"
      # Доступ из контейнера к SOCKS на хосте (ssh -R 11080:… или локальный мост).
      - "host.docker.internal:host-gateway"
    env_file: .env
    environment:
      HOST: 0.0.0.0                  # внутри контейнера — на всех интерфейсах
      PORT: 3000
      PAGE_CACHE_DIR: /data/cache
      OUT_DIR: /data/out
      JOBS_DIR: /data/jobs           # фоновые прогоны на томе: restart их доводит
      SETTINGS_PATH: /data/config.json
      DICTIONARIES_DIR: /data/dictionaries
      DUMPS_DIR: /data/dumps
      # Если SSH -R на хосте, а host.docker.internal молчит — перебор gateway bridge.
      PROXY_HOST_CANDIDATES: host.docker.internal,172.17.0.1,172.18.0.1,172.19.0.1,172.20.0.1
    volumes:
      - enricher-data:/data
    restart: unless-stopped
    # Обход каталога и запросы к модели — сетевые ожидания, не счёт.
    mem_limit: 512m
    stop_grace_period: 15s

volumes:
  enricher-data:

# Вставить в NPM → Proxy Host → Advanced → Custom Nginx Configuration
# (хост, который проксирует на ai-enricher:3000).
#
# Без этого nginx по умолчанию ждёт ~60s и рвёт длинные запросы
# (обогащение /api/enrich, скачивание YML-фида) страницей 502/504,
# хотя сервер ещё считает — деньги за токены уже списаны.

proxy_connect_timeout 60s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;

# Крупные тела: импорт фида / выгрузка фото.
client_max_body_size 80m;
proxy_request_buffering off;
